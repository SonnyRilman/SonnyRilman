<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sonny Rilman — Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFBF8"/>
      <stop offset="0.55" stop-color="#F5F5F1"/>
      <stop offset="1" stop-color="#ECEDEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1010 40) rotate(138) scale(460 340)">
      <stop offset="0" stop-color="#C7A55C" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#C7A55C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(120 300) rotate(-52) scale(420 300)">
      <stop offset="0" stop-color="#5B7CC4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5B7CC4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0V48M0 48H48" stroke="#0B0D12" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9D7CE" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#D9D7CE" stop-opacity="0"/>
      <stop offset="1" stop-color="#D9D7CE" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A7B2F" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#9A7B2F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9A7B2F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>
  <rect width="1200" height="300" fill="url(#glow)" opacity="1">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- monogram -->
  <text x="1128" y="252" text-anchor="end"
        font-family="Georgia, 'Times New Roman', serif" font-size="230" letter-spacing="4"
        fill="none" stroke="#0B0D12" stroke-opacity="0.07" stroke-width="1.25">SR</text>

  <g opacity="1">
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.1s" fill="freeze"/>
    <text x="88" y="108"
          font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace"
          font-size="13" letter-spacing="5.5" fill="#6B7280">FULLSTACK DEVELOPER</text>
  </g>

  <g opacity="1">
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.35s" fill="freeze"/>
    <text x="86" y="182"
          font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
          font-size="70" font-weight="300" letter-spacing="7" fill="#0E1017">SONNY RILMAN</text>
  </g>

  <rect x="88" y="212" width="104" height="2" fill="#9A7B2F">
    <animate attributeName="width" from="0" to="104" dur="0.9s" begin="0.85s" fill="freeze"/>
  </rect>

  <g opacity="1">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.05s" fill="freeze"/>
    <text x="88" y="252"
          font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Consolas, monospace"
          font-size="15" letter-spacing="1.6" fill="#7A8090">Laravel &#183; React &#183; TypeScript &#183; FastAPI</text>
  </g>

  <rect x="0" y="298" width="1200" height="2" fill="url(#hair)"/>
</svg>

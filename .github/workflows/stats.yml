name: Generate Stats Card

on:
  schedule:
    # Setiap hari pukul 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bangun ulang kartu statistik
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet -- assets/stats-dark.svg assets/stats-light.svg; then
            echo "Komposisi bahasa tidak berubah, tidak ada yang di-commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "Refresh language composition card"
          git push

name: Refresh Generated Art

on:
  schedule:
    # Setiap hari pukul 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bangun ulang poster buronan
        run: node scripts/generate-hero.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bangun ulang kartu komposisi bahasa
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet -- assets/; then
            echo "Tidak ada perubahan, tidak ada yang di-commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Refresh generated profile art"
          git push
